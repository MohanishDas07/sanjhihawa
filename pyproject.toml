[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".next",
    "node_modules",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "C901"]
mccabe = { max-complexity = 10 }
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "B008",
]

[tool.coverage.run]
source = ["apps/api"]
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
