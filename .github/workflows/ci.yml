name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  engine-and-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt ruff coverage

      - name: Lint with Ruff
        run: |
          python -m ruff check apps/api tests

      - name: Run Engine & API Unit Tests with Coverage
        run: |
          coverage run --source=apps/api tests/test_all.py
          coverage report --fail-under=70

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: |
          cd apps/web && npm install

      - name: Security Audit
        run: |
          cd apps/web && npm audit --audit-level=critical || true

      - name: TypeScript Check
        run: |
          cd apps/web && npx tsc -p tsconfig.json --noEmit

      - name: Run Frontend Tests
        run: |
          cd apps/web && npm test

      - name: Build Next.js
        run: |
          cd apps/web && npm run build

      - name: Install Playwright Chromium with Dependencies
        run: |
          cd apps/web && npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: |
          cd apps/web && npm run test:e2e
        env:
          CI: true
